[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "production-retrieval-ranking"
version = "0.1.0"
description = "WANDS production product search: Phase 0 bootstrap"
requires-python = ">=3.12,<3.15"
dependencies = ["pandas==3.0.6", "numpy==2.5.3", "scikit-learn==1.9.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
